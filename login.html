<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IPPN iProTracks</title>

    <link rel="stylesheet" href="css/style.css">
 <script type="module" defer src="js/script.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-left">
        <div class="auth-content">
            <h1>Welcome Back</h1>
            <p>Continue your learning journey and unlock opportunities.</p>
        </div>
    </div>

    <div class="auth-right">

        <div class="auth-form-wrapper">

            <div class="auth-brand">
                <h2>IPPN</h2>
                <span>iProTracks</span>
            </div>

            <h3>Login</h3>

            <form id="loginForm">

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-primary auth-btn">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                No account?
                <a href="signup.html">Sign up</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
