<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IPPN iProTracks</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-container">

        <div class="auth-left">
            <div class="auth-overlay"></div>

            <div class="auth-content">
                <h1>Welcome Back</h1>
                <p>
                    Access your courses, track your progress,
                    earn through IL2E, and continue building
                    your global career.
                </p>
            </div>
        </div>

        <div class="auth-right">

            <div class="auth-form-wrapper">

                <div class="auth-brand">
                    <h2>IPPN</h2>
                    <span>iProTracks</span>
                </div>

                <h3>Student Login</h3>

                <form id="loginForm">

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Email Address"
                            required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Password"
                            required>
                    </div>

                    <button type="submit" class="btn-primary auth-btn">
                        Login to Dashboard
                    </button>

                </form>

                <p class="auth-footer">
                    Don't have an account?
                    <a href="signup.html">Create One</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
