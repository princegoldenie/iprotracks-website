<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | IPPN iProTracks</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/script.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-left signup-left">
            <div class="auth-content">
                <h1>Start Your Journey</h1>
                <p>
                    Join a new generation of global professionals learning,
                    earning, and building careers through IPPN iProTracks.
                </p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-right">

            <div class="auth-form-wrapper">

                <div class="auth-brand">
                    <h2>IPPN</h2>
                    <span>iProTracks</span>
                </div>

                <h3>Create Your Account</h3>

                <form id="signupForm">

                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="Full Name"
                            required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Email Address"
                            required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create Password"
                            required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            required>
                    </div>

                    <button type="submit" class="btn-primary auth-btn">
                        Create Account
                    </button>

                </form>

                <p class="auth-footer">
                    Already have an account?
                    <a href="login.html">Login Here</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
