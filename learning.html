<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Learning Studio | IPPN iProTracks</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/learning.js" type="module"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="learning-body">

<!-- SIDEBAR -->
<div class="learning-sidebar">

    <div class="learning-brand">
        <h2>IPPN</h2>
        <span>Learning Studio</span>
    </div>

    <div class="course-meta">
        <h3 id="courseTitle">Loading...</h3>
        <p>Your learning path</p>
    </div>

    <ul id="lessonList" class="lesson-list"></ul>

</div>

<!-- MAIN CONTENT -->
<div class="learning-main">

    <div class="learning-header">
        <div>
            <h1 id="lessonTitle">Select a lesson</h1>
            <p id="lessonDesc">Choose a lesson from the sidebar</p>
        </div>

        <button onclick="logout()" class="btn-primary">
            Logout
        </button>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper">
        <iframe id="lessonVideo"
                src=""
                frameborder="0"
                allowfullscreen>
        </iframe>
    </div>

    <!-- CONTENT -->
    <div class="lesson-content">
        <h2>Lesson Content</h2>
        <div id="lessonContent"></div>
    </div>

    <!-- PROGRESS -->
    <div class="lesson-resources">
        <h2>Actions</h2>

        <button id="completeBtn" class="btn-primary">
            Mark as Completed
        </button>
    </div>

</div>

</body>
</html>
