<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | IPPN iProTracks</title>

    <link rel="stylesheet" href="css/style.css">
    <script defer type="module" src="js/dashboard.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="dashboard-body">

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="sidebar-brand">
        <h2>IPPN</h2>
        <span>Student Panel</span>
    </div>

    <ul class="sidebar-menu">
        <li class="active"><a href="#"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="learning.html"><i class="fas fa-book"></i> My Learning</a></li>
        <li><a href="#"><i class="fas fa-certificate"></i> Certificates</a></li>
        <li><a href="#" onclick="logout()"><i class="fas fa-sign-out"></i> Logout</a></li>
    </ul>

</div>

<!-- MAIN -->
<div class="dashboard-main">

    <div class="dashboard-header">
        <h1>Welcome Back 👋</h1>
        <p id="userEmail">Loading user...</p>
    </div>

    <!-- STATS -->
    <div class="dashboard-stats">

        <div class="dash-card">
            <i class="fas fa-book-open"></i>
            <h3 id="courseCount">0</h3>
            <p>Enrolled Courses</p>
        </div>

        <div class="dash-card">
            <i class="fas fa-chart-line"></i>
            <h3 id="progressCount">0%</h3>
            <p>Average Progress</p>
        </div>

        <div class="dash-card">
            <i class="fas fa-trophy"></i>
            <h3 id="certCount">0</h3>
            <p>Certificates</p>
        </div>

    </div>

    <!-- COURSES -->
    <div class="dashboard-section">

        <div class="section-title">
            <h2>My Courses</h2>
        </div>

        <div id="courseGrid" class="course-grid"></div>

    </div>

</div>

</body>
</html>
